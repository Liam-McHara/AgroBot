name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite needs a real Postgres (ARCH §16); the service below is it.
  TEST_DATABASE_URL: postgres://agrobot:agrobot@localhost:5432/agrobot_test

jobs:
  check:
    name: lint · typecheck · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agrobot
          POSTGRES_PASSWORD: agrobot
          POSTGRES_DB: agrobot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrobot -d agrobot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and check the message catalogues
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit and integration against Postgres)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end (Playwright against the built server, ARCH §15)
        run: pnpm e2e

      - name: Keep the Playwright report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Report known advisories
        # ARCH §17: a report, not a gate — an advisory in a transitive dependency must not
        # stand between a fix and `main`, so the failure is contained to this step and the
        # job still passes. The findings land in the run summary, where they get read.
        # Acting on them is M6's "dependency review" task.
        continue-on-error: true
        shell: bash
        run: |
          {
            echo '## `pnpm audit`'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # `shell: bash` runs with -eo pipefail, which would abort before the fence below.
          set +e
          pnpm audit --audit-level moderate | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
