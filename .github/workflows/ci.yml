name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite needs a real Postgres (ARCH §16); the service below is it.
  TEST_DATABASE_URL: postgres://agrobot:agrobot@localhost:5432/agrobot_test
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: lint · typecheck · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agrobot
          POSTGRES_PASSWORD: agrobot
          POSTGRES_DB: agrobot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrobot -d agrobot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and check the message catalogues
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit, integration against Postgres, hub under workerd)
        run: pnpm test

      - name: Build (shared, Mini App, Worker bundle dry run)
        run: pnpm build

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end (Playwright against wrangler dev, ARCH §15)
        run: pnpm e2e

      - name: Keep the Playwright report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ARCH §15, ADR-0016: migrations against Neon, then the Worker, then the webhook. `main`
  # deploys the production environment; `staging` deploys the staging one (ARCH §15). The
  # secrets come from the GitHub Environment of the same name: CLOUDFLARE_API_TOKEN,
  # CLOUDFLARE_ACCOUNT_ID, DATABASE_URL (Neon, direct), BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET,
  # PUBLIC_URL. Worker secrets are set once with `wrangler secret put`, not here.
  deploy:
    name: deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      WRANGLER_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build shared and the Mini App
        run: pnpm --filter @agrobot/shared build && pnpm --filter @agrobot/miniapp build

      - name: Apply migrations to Neon (forward-only)
        run: pnpm --filter @agrobot/server db:migrate
        env:
          SKIP_DOTENV: '1'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy the Worker
        run: >-
          pnpm --filter @agrobot/server exec wrangler deploy
          --env "$WRANGLER_ENV"
          --var "GIT_COMMIT:${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Register the Telegram webhook and command menu
        run: pnpm bot:set-webhook
        env:
          SKIP_DOTENV: '1'
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}

  audit:
    name: dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Report known advisories
        # ARCH §17: a report, not a gate — an advisory in a transitive dependency must not
        # stand between a fix and `main`, so the failure is contained to this step and the
        # job still passes. The findings land in the run summary, where they get read.
        # Acting on them is M6's "dependency review" task.
        continue-on-error: true
        shell: bash
        run: |
          {
            echo '## `pnpm audit`'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # `shell: bash` runs with -eo pipefail, which would abort before the fence below.
          set +e
          pnpm audit --audit-level moderate | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
